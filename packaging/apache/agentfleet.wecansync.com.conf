# AgentFleet landing page and release downloads: static files only.
# Install on the web host as /etc/apache2/sites-available/agentfleet.wecansync.com.conf,
# then: a2ensite agentfleet.wecansync.com && apache2ctl configtest && systemctl reload apache2
# and:  certbot --apache -d agentfleet.wecansync.com --redirect
<VirtualHost *:80>
    ServerName agentfleet.wecansync.com
    DocumentRoot /var/www/agentfleet.wecansync.com

    <Directory /var/www/agentfleet.wecansync.com>
        Options -Indexes -Includes -ExecCGI +SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
    </Directory>

    # Scripts are served as text so browsers show them and nothing executes them.
    AddType "text/plain; charset=utf-8" .sh .ps1
    AddType "application/json; charset=utf-8" .json
    AddType "image/svg+xml" .svg

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; frame-ancestors 'none'"

    # Mutable entry points must never be served stale.
    <FilesMatch "^(index\.html|install\.sh|install\.ps1|latest\.json)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    # Published releases never change.
    <LocationMatch "^/releases/[0-9]+\.[0-9]+\.[0-9]+/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/agentfleet.wecansync.com-error.log
    CustomLog ${APACHE_LOG_DIR}/agentfleet.wecansync.com-access.log combined
</VirtualHost>
